# Adaptive (Track B/C) CI. Paper only: no secrets, no broker credentials, no deploy, no network access to NSE/FYERS.
name: adaptive-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adaptive-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adaptive-python:
    name: adaptive-python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { TZ: Asia/Kolkata }
    defaults: { run: { working-directory: automation/paper-trading } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m pip install pyyaml
      - run: python -m unittest discover -s tests -p 'test_*.py'
        working-directory: live
  adaptive-dashboard:
    name: adaptive-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { TZ: Asia/Kolkata }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - run: npx vitest run
  adaptive-truncation:
    name: adaptive-truncation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { TZ: Asia/Kolkata }
    defaults: { run: { working-directory: automation/paper-trading/tests } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -r ../requirements.txt
      - env: { PYTHONPATH: .. }
        run: python -m unittest -v test_adaptive_truncation_ci
        
